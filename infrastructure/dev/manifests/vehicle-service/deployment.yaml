apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-service
  namespace: toll-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vehicle-service
  template:
    metadata:
      labels:
        app: vehicle-service
    spec:
      containers:
        - name: vehicle-service
          image: vehicle-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          env:
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: shared-configmap
                  key: RABBITMQ_URL
            - name: DB_HOST
              value: pg-vehicle-service
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pg-vehicle-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-vehicle-secret
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: pg-vehicle-secret
                  key: database
