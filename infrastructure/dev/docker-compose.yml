include:
  - path: ../../services/vehicle-service/docker-compose.yaml
    env_file: ../../services/vehicle-service/.env
  - path: ../../services/payment-service/docker-compose.yaml
    env_file: ../../services/payment-service/.env

services:
  rabbitmq:
    image: rabbitmq:4.3.5-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
