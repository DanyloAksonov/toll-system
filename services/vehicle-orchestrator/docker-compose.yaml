services:
  vehicle-orchestrator:
    image: vehicle-orchestrator:dev
    working_dir: /app/services/vehicle-orchestrator
    env_file: .env
    build:
      context: ../..
      dockerfile: services/vehicle-orchestrator/Dockerfile.dev
    volumes:
      - .:/app/services/vehicle-orchestrator
      - /app/services/vehicle-orchestrator/node_modules
    ports:
      - ${SERVICE_PORT}:${SERVICE_PORT}
    depends_on:
      - vehicle-orchestrator-pg
  vehicle-orchestrator-pg:
    image: postgres:18
    env_file: .env
    volumes:
      - vehicle-orchestrator-db-data:/etc/data
    ports:
      - 5435:${DB_PORT}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

volumes:
  vehicle-orchestrator-db-data:
    name: 'vehicle-orchestrator-pg-volume'
