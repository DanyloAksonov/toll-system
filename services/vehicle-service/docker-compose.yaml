services:
  vehicle-service:
    image: vehicle-service:dev
    working_dir: /app
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - ${SERVICE_PORT}:${SERVICE_PORT}
    depends_on:
      - vehicle-pg
  vehicle-pg:
    image: postgres:18
    env_file: .env
    volumes:
      - vehicle-db-data:/etc/data
    ports:
      - ${DB_PORT}:${DB_PORT}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

volumes:
  vehicle-db-data:
    name: 'vehicle-pg-volume'
